processes:
  db:
    cmd: "docker compose up postgres"
    port: 5432
    free_port: false

  api:
    cmd: "pnpm --filter @pu/api dev"
    cwd: "."
    port: 4000
    free_port: true
    env:
      PATH: "/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      DATABASE_URL: "postgresql://pu_user:pu_password@localhost:5432/pu_connector_db"
      PORT: "4000"
      HOST: "0.0.0.0"

  web:
    cmd: "pnpm --filter @pu/web dev"
    cwd: "."
    port: 3000
    free_port: true
    env:
      PATH: "/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
      PORT: "3000"

  web-2:
    cmd: "pnpm --filter @pu/web build && pnpm --filter @pu/web start -p 3001"
    cwd: "."
    port: 3001
    free_port: true
    env:
      PATH: "/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
      PORT: "3001"

