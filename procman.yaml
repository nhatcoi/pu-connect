processes:
  db:
    cmd: "docker compose up postgres"
    port: 5432
    free_port: false

  api:
    cmd: "pnpm --filter @pu/api dev"
    cwd: "."
    port: 4000
    free_port: true
    env:
      PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      DATABASE_URL: "postgresql://pu_user:pu_password@localhost:5432/pu_connector_db"
      PORT: "4000"
      HOST: "0.0.0.0"
      # SESSION_SECRET, R2_* đọc từ apps/api/.env (không commit secret)
      R2_BUCKET_NAME: "pu-connector"
      R2_PUBLIC_URL: "https://pub-66e8a07080a74cb697df1ffbf74a4ecb.r2.dev"

  web:
    cmd: "pnpm --filter @pu/web dev"
    cwd: "."
    port: 3000
    free_port: true
    env:
      PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      INTERNAL_API_URL: "http://localhost:4000"
      NEXT_PUBLIC_R2_URL: "https://pub-66e8a07080a74cb697df1ffbf74a4ecb.r2.dev"
      PORT: "3000"

  web-2:
    cmd: "NEXT_DIST_DIR=.next-prod pnpm --filter @pu/web build && NEXT_DIST_DIR=.next-prod pnpm --filter @pu/web start -p 3001"
    cwd: "."
    port: 3001
    free_port: true
    env:
      PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/home/nhatcoi/.nvm/versions/node/v24.14.0/bin:/home/nhatcoi/.local/bin:/usr/local/bin:/usr/bin:/bin"
      INTERNAL_API_URL: "http://localhost:4000"
      NEXT_DIST_DIR: ".next-prod"
      PORT: "3001"

