# ==============================================================================
# NGINX CONFIG CHO ADMIN CONSOLE RIÊNG BIỆT (admin-puc.vnhat.dev)
# Kiến trúc Static SPA (Vite build -> apps/admin/dist) — Tốn 0 MB RAM Node.js
# ==============================================================================

server {
    listen 80;
    server_name admin-puc.vnhat.dev;

    # 1. Phục vụ trực tiếp Static SPA từ apps/admin/dist (0 MB RAM runtime)
    root /var/www/pu-connector/apps/admin/dist;
    index index.html;

    # Security Headers cho cổng Quản trị
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache dài hạn cho static assets có hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. Proxy toàn bộ API (/api/admin/*, /api/auth/*) về NestJS pu-api (cổng 4001)
    location /api/ {
        proxy_pass http://127.0.0.1:4001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. SPA Fallback về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==============================================================================
# GỢI Ý BẢO MẬT TRÊN VHOST PUBLIC (puc.vnhat.dev):
# Thêm block sau vào server block của puc.vnhat.dev (trước location /api/):
#
#   location ^~ /api/admin/ {
#       return 404;
#   }
# ==============================================================================
