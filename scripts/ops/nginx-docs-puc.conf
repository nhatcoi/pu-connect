# ==============================================================================
# NGINX CONFIG CHO TRANG TÀI LIỆU DỰ ÁN (docs-puc.vnhat.dev)
# Kiến trúc Static SPA (Vite build -> apps/docs/dist) — Tốn 0 MB RAM Node.js
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name docs-puc.vnhat.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs-puc.vnhat.dev;
    include /etc/nginx/snippets/pu-cloudflare-realip.conf;

    # SSL Certificate (dùng chung wildcard vnhat.dev hoặc cert puc.vnhat.dev cho Cloudflare Full)
    ssl_certificate /etc/letsencrypt/live/puc.vnhat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puc.vnhat.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pu-connector/apps/docs/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security Headers cho cổng Tài liệu
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Cache dài hạn cho static assets có hash (JS/CSS/SVG)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback về index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
